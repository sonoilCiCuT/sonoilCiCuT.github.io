<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <style>
            :root{
                --back-color: rgb(235, 235, 235);
            }
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pacifico&display=swap');
            html{
                background-image: url("https://salirporbarcelona.com/wp-content/uploads/2023/08/100-COSAS-QUE-VER-EN-BARCELONA.jpg"); 
                background-color: var(--back-color);
                background-size: cover;
                background-repeat: no-repeat;
                padding: 0;
                width: 100%;
                height: 100%;
                font-family: 'Inter', sans-serif;
                font-optical-sizing: auto;                
            }
            body{
                background-color: rgba(0,0,0,0.5);
                margin: 0;
                width: 100%;
                height: 100%;
            }
            .cont{
                position: absolute;
                top: 66%;
                width: 100%;
                height: max-content;
                background-color: var(--back-color);
                display: grid;
                /*grid-template-columns: 30% 30% 30%;
                grid-template-rows: repeat(5,40vh);*/
                grid-template-columns: 30% 30% 30%;
                grid-template-rows: repeat(8,40vh);
                justify-content: center;
                column-gap: 2%;
                row-gap: 6vh;
                padding-top: 6vh;
                padding-bottom: 6vh;
            }
            .element{
                
                display: block;
                transition: .3s ease-out;
                height: 100%;
                width: 100%;
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                background-color: rgba(0,0,0,0.5);
                align-content: end;
                align-items: end;
            }
            .element:hover{
                scale:1.05;  
            }
            .element:hover>.title{
                background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0.9));    
                color: var(--back-color);
                align-content: center;
                height: 100%;
            }
            .element:hover .exlink{
                filter: opacity(1)  invert(1) brightness(1000);
                scale:1;
            }
            .title{
                transition: .2s ease-out;
                width: 100%;
                height: 0;
                background-color: transparent;
                font-size: 3.5rem;
                text-align: center;
                align-content: center;
                justify-content: center;
                color: transparent;
                display: flex;
                flex-direction: column;
                font-weight: 550;
                justify-content: end;
            }
            /*.title{
                transition: .3s ease-out;
                width: 100%;
                height: 100%;
                background-color: transparent;
                font-size: 3.5rem;
                text-align: center;
                align-content: flex-end;
                color: transparent;
                line-height: 3;
                }*/
                .exlink{
                    width: 5rem;
                    filter:opacity(0) invert(1)  brightness(1000);
                    transition: .3s ease-out;
                    scale:0;
                }
                .exlink:hover{
                    scale: 1.1;
                }
                #title{
                    font-family: "Pacifico", cursive;
                    font-weight: 400;
                    font-style: normal;
                    font-size: 20vh;
                    width: 100%;
                    height: 66%;
                    margin: 0;
                    text-align: center;
                    align-content: end;
                    color:var(--back-color);
                    text-shadow: 0px 0px 10px var(--back-color);
                }
                #map{ 
                    box-shadow:  0 0 10px black;
                    justify-self: center;
                    align-self: center;
                    height: 80%; 
                    width: 66%;
                    grid-column: span 3;
                    grid-row: span 2;
                }
                @media (max-width: 1180px) {
                    #title{
                        font-size: 12vw;
                    }
                    
                    .cont{
                        grid-template-columns: 90%;
                        grid-template-rows: repeat(15,70vh);
                    }
                    .element{
                        background-position: center;
                    }
                    #map{
                        grid-column: span 1;
                        width: 100%;
                    }
                }
            </style>
            <script>                            
                function setGrid(){
                    var grid = [

                        {image:'https://cdn-imgix.headout.com/media/images/bade040d-b735-4ea6-ab37-d40f6fa018ba-1755188225330-303048%20%281%29.jpg',name:"Tibidabo",maps:"https://www.google.com/maps/place/Tibidabo/@41.4044069,2.1138694,13z/data=!4m15!1m8!3m7!1s0x12a49816718e30e5:0x44b0fb3d4f47660a!2sBarcellona,+Spagna!3b1!8m2!3d41.3874374!4d2.1686496!16zL20vMDFmNjI!3m5!1s0x12a49789cff3db45:0xdb92ebc64b4e2a63!8m2!3d41.4225!4d2.118611!16zL20vMGtjNjI?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:"https://irbarcelona.it/chiese-barcellona/tempio-espiatorio-del-sacro-cuore-di-gesu/"},

                        {image:'https://www.barcellona.org/wp-content/uploads/sites/14/barcellona-montjuic-scalinata-hd.jpg',name:"Montjuic",maps:"https://www.google.com/maps/place/Montju%C3%AFc,+Sants-Montju%C3%AFc,+Barcellona,+Spagna/@41.3663448,2.1567675,15z/data=!4m15!1m8!3m7!1s0x12a49816718e30e5:0x44b0fb3d4f47660a!2sBarcellona,+Spagna!3b1!8m2!3d41.3874374!4d2.1686496!16zL20vMDFmNjI!3m5!1s0x12a4a26c577b0a6f:0x1c43588300ab7610!8m2!3d41.3663448!4d2.1567675!16s%2Fg%2F11y9tyc97?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                        {image:'https://cdn.sanity.io/images/nxpteyfv/goguides/1d9cc50b78c31d6f893cf15dc51ba9e6818652d1-1600x1066.jpg',name:"Bunkers del Carmel",maps:"https://www.google.com/maps/place/Bunkers+del+Carmel/@41.419236,2.161779,13z/data=!4m15!1m8!3m7!1s0x12a49816718e30e5:0x44b0fb3d4f47660a!2sBarcellona,+Spagna!3b1!8m2!3d41.3874374!4d2.1686496!16zL20vMDFmNjI!3m5!1s0x12a4a34ce3cd2c89:0x78eec059f995ffe3!8m2!3d41.419236!4d2.161779!16s%2Fg%2F11l2_xprch?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                        {image:'https://www.barcelo.com/guia-turismo/wp-content/uploads/ok-arc-de-triomf.jpg',name:"Arc de Triomf",maps:"https://www.google.com/maps/place/Arco+di+Trionfo/@41.4051517,2.1414737,13z/data=!4m15!1m8!3m7!1s0x12a49816718e30e5:0x44b0fb3d4f47660a!2sBarcellona,+Spagna!3b1!8m2!3d41.3874374!4d2.1686496!16zL20vMDFmNjI!3m5!1s0x12a4a2e3366a76a1:0xa9fe2baff53795b1!8m2!3d41.3910524!4d2.1806449!16zL20vMGJqeTZ4?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                        {image:'https://offloadmedia.feverup.com/barcelonasecreta.com/wp-content/uploads/2017/10/09111556/centroportada-1024x597.jpg',name:"Ciutat Vella",maps:"https://www.google.com/maps/place/Ciutat+Vella,+Barcellona,+Spagna/@41.3749781,2.1814056,14z/data=!3m1!4b1!4m6!3m5!1s0x12a4a2f628927535:0x9261a9f64a1b3b12!8m2!3d41.3839789!4d2.1787364!16zL20vMDFxXzFj?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                        {image:'https://mywowo.net/media/images/cache/barcellona_barcelloneta_01_itinerario_jpg_1200_630_cover_85.jpg',name:"Barceloneta",maps:"https://www.google.com/maps/place/La+Barceloneta,+Ciutat+Vella,+Barcellona,+Spagna/@41.3728236,2.1704713,14z/data=!3m1!4b1!4m6!3m5!1s0x12a4a30709605c93:0x2600fae14082f052!8m2!3d41.3801061!4d2.1896957!16s%2Fm%2F02xbjlb?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                        {image:'https://upload.wikimedia.org/wikipedia/commons/6/6c/Palau_de_la_M%C3%BAsica_Catalana%2C_the_Catalan_Concert_Hall.jpg',name:"Palau de la musica catalana",maps:"https://www.google.com/maps/place/Palau+de+la+M%C3%BAsica+Catalana/@41.3875752,2.1753128,16z/data=!4m15!1m8!3m7!1s0x12a4a2f628927535:0x9261a9f64a1b3b12!2sCiutat+Vella,+Barcellona,+Spagna!3b1!8m2!3d41.3839789!4d2.1787364!16zL20vMDFxXzFj!3m5!1s0x12a4a2fa77ab0441:0x7faa64b56a736c43!8m2!3d41.3875752!4d2.1753128!16zL20vMHFsbTI?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:"https://tickets.palaumusica.cat/it-IT/513/10450?s=maps&f=nav&lang=it-IT"},

                        {image:'https://images.trvl-media.com/place/6067011/c400038f-803a-4fe4-acf0-784d98304160.jpg',name:"Gran Teatre del Liceu",maps:"https://www.google.com/maps/place/Gran+Teatre+del+Liceu/@41.3802009,2.1707199,17z/data=!3m2!4b1!5s0x12a4a258095f2359:0x15e622ccfb2611fc!4m6!3m5!1s0x12a4a2580540cc5b:0xa05d8e0a1059639d!8m2!3d41.3801969!4d2.1732948!16zL20vMDFzcGo4?entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D",shop:null},
                    ]
                    Array.from(grid).forEach(o => {
                        element = document.createElement('div')
                        element.classList.add('element')
                        element.style.backgroundImage = "url('" + o.image + "')";

                        title = document.createElement('div')
                        title.classList.add('title')

                        attr = document.createElement('span')
                        attr.innerHTML = o.name

                        link = document.createElement('span')

                        exlink = [document.createElement('a'),document.createElement('a')]
                        exlink[0].href = o.maps
                        exlink[0].classList.add('place')
                        exlink[1].href = o.shop

                        img = [document.createElement('img'),document.createElement('img')]
                        img[0].classList.add('exlink')
                        img[0].src = 'https://www.svgrepo.com/show/532540/location-pin-alt-1.svg'
                        img[1].classList.add('exlink')
                        img[1].src = 'https://www.svgrepo.com/show/529545/dollar.svg'

                        exlink[0].appendChild(img[0])
                        exlink[1].appendChild(img[1])

                        link.appendChild(exlink[0])
                        if(o.shop != null) link.appendChild(exlink[1])

                        title.appendChild(attr)
                        title.appendChild(link)

                        element.appendChild(title)

                        document.getElementsByClassName('cont')[0].appendChild(element)
                    });
                        
                }

                function init(){
                    setGrid();
                    var map = L.map("map").setView([41.397, 2.164],13)
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
                    arr = document.getElementsByClassName("place")
                    j = 0;
                    myicon = L.icon({
                        iconUrl: "https://www.svgrepo.com/show/269889/badges-star.svg",
                        iconSize: [38, 95],
                        iconAnchor: [22, 94],
                        popupAnchor: [-3, -76]
                    })
                    map.scrollWheelZoom.disable();
                    Array.from(arr).forEach(function(i){
                        name = i.parentNode.parentNode.getElementsByTagName("span")[0].innerHTML
                        id = "d"+(j++);
                        i.parentNode.parentNode.id = id;
                        i = i.href.split("41.")
                        i = i[i.length - 1]
                        //console.log("41." + i.split("!4d")[0] + " " + i.split("!4d")[1].substring(0,6))
                        L.marker(["41." + i.split("!4d")[0], i.split("!4d")[1].substring(0,6)],{icon: myicon}).addTo(map).bindPopup("<a href='#"+id+"'>"+name+"</a>")
                        //!8m2!3d !16zL20vM
                    })
                } 
            </script>
    </head>
    <body onload="init()">
        <p id="title">Barcellona</p>
        <div class="cont">
            <div id="map"></div>
        </div>
    </body>
    </html>
