<!DOCTYPE html>
<html>
    <head>
        <style>
            :root{
                --back-color: rgb(235, 235, 235);
            }
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pacifico&display=swap');
            html{
                background-image: url("https://salirporbarcelona.com/wp-content/uploads/2023/08/100-COSAS-QUE-VER-EN-BARCELONA.jpg"); 
                background-color: var(--back-color);
                background-size: cover;
                background-repeat: no-repeat;
                padding: 0;
                width: 100%;
                height: 100%;
                font-family: 'Inter', sans-serif;
                font-optical-sizing: auto;                
            }
            body{
                background-color: rgba(0,0,0,0.5);
                margin: 0;
                width: 100%;
                height: 100%;
            }
            .cont{
                position: absolute;
                top: 66%;
                width: 100%;
                height: max-content;
                background-color: var(--back-color);
                display: grid;
                /*grid-template-columns: 30% 30% 30%;
                grid-template-rows: repeat(5,40vh);*/
                grid-template-columns: 45% 45%;
                grid-template-rows: repeat(7,60vh);
                justify-content: center;
                column-gap: 2%;
                row-gap: 6vh;
                padding-top: 6vh;
                padding-bottom: 6vh;
            }
            .element{
                box-shadow: 0px 0px 10px black;
                display: block;
                transition: .3s ease-out;
                height: 100%;
                width: 100%;
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                background-color: rgba(0,0,0,0.5);
                align-content: end;
                align-items: end;
            }
            .element:hover{
                scale:1.05;  
            }
            .element:hover>.title{
                background-color: rgba(0,0,0,0.5);
                color: var(--back-color);
                align-content: center;
            }
            .element:hover .exlink{
                filter: opacity(1)  invert(1) brightness(1000);
                scale:1;
            }
            .title{
                transition: .3s ease-out;
                width: 100%;
                height: 100%;
                background-color: transparent;
                font-size: 3.5rem;
                text-align: center;
                align-content: center;
                justify-content: center;
                color: transparent;
                display: flex;
                flex-direction: column;
                font-weight: 550;
                justify-content: end;
            }
            /*.title{
                transition: .3s ease-out;
                width: 100%;
                height: 100%;
                background-color: transparent;
                font-size: 3.5rem;
                text-align: center;
                align-content: flex-end;
                color: transparent;
                line-height: 3;
                }*/
                .exlink{
                    width: 5rem;
                    filter:opacity(0) invert(1)  brightness(1000);
                    transition: .3s ease-out;
                    scale:0;
                }
                .exlink:hover{
                    scale: 1.1;
                }
                #title{
                    font-family: "Pacifico", cursive;
                    font-weight: 400;
                    font-style: normal;
                    font-size: 20vh;
                    width: 100%;
                    height: 66%;
                    margin: 0;
                    text-align: center;
                    align-content: end;
                    color:var(--back-color);
                    text-shadow: 0px 0px 10px var(--back-color);
                }
                @media (max-width: 1180px) {
                    #title{
                        font-size: 12vw;
                    }

                    .cont{
                        grid-template-columns: 90%;
                        grid-template-rows: repeat(14,70vh);
                    }
                    .element{
                        background-position: center;
                    }
                }
                </style>
    </head>
