<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            background-color: black;
            height: 100%;
            display: block;
        }
        body{
            height: 100%;
            background-color: black;
            display: block;
        }
        #circle{
            border: 5px solid white;
            border-radius: 50%;
            display: block;
            position:absolute;
        }
    </style>
    <script>
        var circle,height;
        function init(){
            height = (document.getElementsByTagName("html")[0].clientHeight);
            console.debug(height)
            circle = document.getElementById("circle");
            circle.setAttribute("style","width: "+height*0.6+"px;height: "+height*0.6+"px;left:"+height*0.6/2+"px;top:"+height*0.6/2+"px");
        }
    </script>
</head>
<body onload="init()">
    <div id="circle"></div>
</body>
</html>
